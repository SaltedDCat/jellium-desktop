name: build-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/windows-x64-enhancement
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: windows64
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.pkg_prefix }}-cc
            ${{ matrix.pkg_prefix }}-clang
            ${{ matrix.pkg_prefix }}-meson
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.pkg_prefix }}-ffmpeg
            ${{ matrix.pkg_prefix }}-libplacebo
            ${{ matrix.pkg_prefix }}-libass
            ${{ matrix.pkg_prefix }}-vulkan-headers
            ${{ matrix.pkg_prefix }}-vulkan-loader
            ${{ matrix.pkg_prefix }}-shaderc
            ${{ matrix.pkg_prefix }}-spirv-cross
            ${{ matrix.pkg_prefix }}-llvm

      - name: Build mpv from source
        shell: pwsh
        run: |
          dev\windows\build_mpv_source.ps1 -Arch ${{ matrix.arch }} -Force

      - name: Build and package
        shell: cmd
        env:
          # bindgen (used by jfn-mpv's build.rs) dlopens libclang at
          # build time. The mingw-w64-clang-*-llvm package ships
          # libclang.dll under the msystem prefix's bin/; cmd.exe
          # doesn't pick that up from setup-msys2, so point bindgen
          # at it explicitly.
          LIBCLANG_PATH: C:\msys64\${{ matrix.msystem }}\bin
          MSYS_BIN: C:\msys64\${{ matrix.msystem }}\bin
          # mingw's libclang doesn't auto-pick the MSVC target triple, so
          # MSVC's arch-specific headers (__int64, vcruntime intrinsics,
          # etc.) get parsed against the wrong default target. Pin it.
          BINDGEN_EXTRA_CLANG_ARGS: --target=${{ matrix.triple }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %MATRIX_ARCH% || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"
          cargo xtask package --external-mpv "%CD%\third_party\mpv-install" --prefix build/install --dist dist

      - name: Verify Windows x64 executable and enhancement bridge
        shell: pwsh
        run: |
          $Exe = Join-Path $PWD "build/install/jellium-desktop.exe"
          $Bytes = [IO.File]::ReadAllBytes($Exe)
          $PeOffset = [BitConverter]::ToInt32($Bytes, 0x3c)
          $Machine = [BitConverter]::ToUInt16($Bytes, $PeOffset + 4)
          if ($Machine -ne 0x8664) { throw "Expected Windows x64 PE executable" }
          $Text = [Text.Encoding]::UTF8.GetString($Bytes)
          foreach ($Marker in @("JelliumMpvEnhancement", "playerSetEnhancement", "mpv-web-glsl-v1")) {
            if (-not $Text.Contains($Marker)) { throw "Missing enhancement bridge marker: $Marker" }
          }
          $Process = Start-Process -FilePath $Exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($Process.ExitCode -ne 0) { throw "Executable smoke test failed: $($Process.ExitCode)" }
          Write-Host "Verified Windows x64 executable, DLL loading and Web GLSL enhancement bridge"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/JelliumDesktop-*.zip
